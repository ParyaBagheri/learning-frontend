<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Login page</title>

    <style>
        body {
            margin:200px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            overflow:scroll;
        }
        main{
            align-items: center;
        }
        form {
            color:crimson;
            margin: 36px;
            padding-bottom: 96px;
            font-size: 24px;
        }
        form div{
            margin: 16px;
        }
        input:focus {
            width:300px;
            height:32px;
            border: 10px;
            border-radius: 8px;
            border-color: darkred;
            color:darkred;
            margin: 5px;
        }
        section {
            margin-bottom: 40px;
            color:brown;
        }
        header {
            color:darkred;
            width:300px;
            font-size:large;
            margin-bottom:16px;
        }
        button {
            width: 100px;
            height:36px;
            margin:16px;
            background-color:crimson;
            border-radius:8px;
            border-color:crimson;
            color:white;
            font-size:16px;
            
        }
    </style>
</head>

<body>
    <header>
        <h1>Login page</h1>
    </header>
        <main>
            <div>
            <section>
                <h2>Sign in</h2>
                <p>sign in with your username and password</p>
                <form>
                    <div>
                        <label>
                            Your username
                            <input type="text" placeholder="Enter Username">
                        </label>
                    </div>
                    <div>
                        <label>
                            Your password
                            <input type="password" placeholder="Enter Password">
                        </label>
                    </div>
                    <button type="submit">Enter</button>
                </form>
                <p>not a member?
                    <a href="signup.html" target="_blank" >sign up here</a>
                    </p>
            </section>
            </div>
            <div class="gallery">
                <section>
                    <h2>gallery</h2>
                    <p>see some random pics~</p>
                </section>
            </div>

        </main>
</body>
