<!DOCTYPE html>

<html>

    <head>

        <title>Contact</title>

        <style>

            body {
                font-family: Arial;
            }

            .contact-form {
                width: 400px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .form-group label {
                display: block;
                margin-bottom: 5px;
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 10px;
            }

            .submit-button {
                padding: 10px 20px;
            }

        </style>

    </head>


    <body>

        <header class="site-header">

            <nav class="main-nav">

                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="articles.html">Articles</a>
                <a href="contact.html">Contact</a>
                <a href="signup.html">Sign Up</a>

            </nav>

        </header>


        <main class="main-content">

            <section class="contact-section">

                <h1>Contact Me</h1>

                <p>
                    Fill out the form below to contact me.
                </p>


                <form class="contact-form">

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Write your message"
                            required
                        ></textarea>

                    </div>


                    <button
                        class="submit-button"
                        type="submit"
                    >
                        Send Message
                    </button>

                </form>

            </section>

        </main>


        <footer class="site-footer">

            <p>© 2026 My Portfolio</p>

        </footer>

    </body>

</html>
